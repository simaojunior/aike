services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: kyc
      POSTGRES_PASSWORD: kyc
      POSTGRES_DB: document_ocr_dev
    ports:
      - "127.0.0.1:${PGPORT:-5432}:5432"
    volumes:
      - postgres18_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kyc -d document_ocr_dev"]
      interval: 5s
      timeout: 5s
      retries: 10
  seaweedfs:
    image: docker.io/chrislusf/seaweedfs:4.53
    command: server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
    ports:
      - "127.0.0.1:${S3_PORT:-8333}:8333"
      - "127.0.0.1:${SEAWEEDFS_FILER_PORT:-8888}:8888"
    volumes:
      - seaweedfs_data:/data
      - ./dev/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9333/cluster/status"]
      interval: 5s
      timeout: 3s
      retries: 20

  seaweedfs-init:
    image: docker.io/chrislusf/seaweedfs:4.53
    depends_on:
      seaweedfs:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      echo 's3.bucket.create -name aike-dev' | weed shell -master=seaweedfs:9333
      "

volumes:
  postgres18_data:
  seaweedfs_data:
