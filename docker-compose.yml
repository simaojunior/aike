services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: kyc
      POSTGRES_PASSWORD: kyc
      POSTGRES_DB: document_ocr_dev
    ports:
      - "127.0.0.1:${PGPORT:-5432}:5432"
    volumes:
      - postgres18_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kyc -d document_ocr_dev"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres18_data:
